[project]
name = "openextract"
version = "0.13.1"
description = "Extract structured data from documents, images, audio, and video using LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Cole McIntosh" }
]
keywords = ["llm", "extraction", "pydantic", "ai", "document", "structured-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-ai-slim>=1.37.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=1.37.0"]
anthropic = ["pydantic-ai-slim[anthropic]>=1.37.0"]
google = ["pydantic-ai-slim[google]>=1.37.0"]
bedrock = ["pydantic-ai-slim[bedrock]>=1.37.0"]
cohere = ["pydantic-ai-slim[cohere]>=1.37.0"]
groq = ["pydantic-ai-slim[groq]>=1.37.0"]
huggingface = ["pydantic-ai-slim[huggingface]>=1.37.0"]
mistral = ["pydantic-ai-slim[mistral]>=1.37.0"]
openrouter = ["pydantic-ai-slim[openrouter]>=1.37.0"]
xai = ["pydantic-ai-slim[xai]>=1.37.0"]
logfire = ["pydantic-ai-slim[logfire]>=1.37.0"]
pdf = ["pypdfium2>=4.30.0"]
all = [
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,huggingface,logfire,mistral,openai,openrouter,xai]>=1.37.0",
    "pypdfium2>=4.30.0",
]

[project.scripts]
openextract = "openextract._cli:main"

[project.urls]
Homepage = "https://github.com/Mellow-Artificial-Intelligence/openextract"
Documentation = "https://mellow-artificial-intelligence.github.io/openextract/"
Repository = "https://github.com/Mellow-Artificial-Intelligence/openextract"
Issues = "https://github.com/Mellow-Artificial-Intelligence/openextract/issues"
Changelog = "https://github.com/Mellow-Artificial-Intelligence/openextract/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openextract"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.10",
    "ty>=0.0.35",
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,huggingface,logfire,mistral,openai,openrouter,xai]>=1.37.0",
    "pypdfium2>=4.30.0",
]

[tool.ty]
# Type-check library code only; tests intentionally use invalid types for error paths.
[tool.ty.src]
include = ["src/openextract"]

[tool.ty.environment]
python-version = "3.12"

[tool.uv]
# Supply-chain embargo: refuse any package version published less than 24 hours ago.
# This bought us protection during the Mistral package compromise. The date is
# bumped forward daily by the `.github/workflows/embargo-bump.yml` workflow so
# the rolling 24h window holds without manual maintenance.
exclude-newer = "2026-09-05T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP047"]  # TypeVar pattern is valid for pydantic-ai compatibility

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: live model/API calls (set OPENEXTRACT_LIVE_SMOKE=1 or OPENEXTRACT_RUN_EXAMPLES=1)",
]

[tool.coverage.run]
branch = true
source = ["openextract"]

[tool.coverage.report]
show_missing = true
fail_under = 100
