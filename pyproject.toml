[project]
name = "openextract"
version = "1.2.0"
description = "Extract structured data from documents, images, audio, and video using LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Cole McIntosh" }
]
keywords = ["llm", "extraction", "pydantic", "ai", "document", "structured-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/Mellow-Artificial-Intelligence/openextract"
Documentation = "https://mellow-artificial-intelligence.github.io/openextract/"
Repository = "https://github.com/Mellow-Artificial-Intelligence/openextract"
Issues = "https://github.com/Mellow-Artificial-Intelligence/openextract/issues"
Changelog = "https://github.com/Mellow-Artificial-Intelligence/openextract/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openextract"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.10",
    "ty>=0.0.35",
]

[tool.ty]
# Type-check library code only; tests intentionally use invalid types for error paths.
[tool.ty.src]
include = ["src/openextract"]

[tool.ty.environment]
python-version = "3.12"

[tool.uv]
# Supply-chain embargo: refuse any package version published after this date.
# This bought us protection during the Mistral package compromise. Upgrades are
# manual: move the date to at least 24 hours ago, then run `uv lock --upgrade`.
exclude-newer = "2026-10-14T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: opt-in provider API calls (requires --live and provider credentials)"]

[tool.coverage.run]
branch = true
source = ["openextract"]

[tool.coverage.report]
show_missing = true
fail_under = 100
