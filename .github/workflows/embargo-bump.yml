name: Embargo bump

on:
  schedule:
    # Runs at 03:00 UTC daily. Bumps the supply-chain embargo cutoff in
    # pyproject.toml forward to (today - 24h), then opens a PR with the
    # refreshed uv.lock.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: embargo-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Compute new cutoff (24h ago, UTC midnight)
        id: cutoff
        run: |
          NEW_CUTOFF="$(date -u -d 'yesterday 00:00' +%Y-%m-%dT%H:%M:%SZ)"
          echo "value=$NEW_CUTOFF" >> "$GITHUB_OUTPUT"

      - name: Patch pyproject.toml exclude-newer
        run: |
          python - <<'PY'
          import os, re, pathlib
          new = os.environ["NEW_CUTOFF"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          updated = re.sub(
              r'(exclude-newer\s*=\s*")[^"]+(")',
              rf'\g<1>{new}\g<2>',
              text,
              count=1,
          )
          path.write_text(updated)
          PY
        env:
          NEW_CUTOFF: ${{ steps.cutoff.outputs.value }}

      - name: Re-lock dependencies
        run: uv lock

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_CUTOFF: ${{ steps.cutoff.outputs.value }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "No changes - embargo already current."
            exit 0
          fi
          BRANCH=chore/embargo-bump
          TITLE="chore: bump dependency embargo to ${NEW_CUTOFF}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "$TITLE"
          # Checkout has only main, so lease has no expected remote tip; this branch is workflow-owned.
          git push --force origin "$BRANCH"
          # Org settings can deny Actions create-PR even after a successful push.
          # Look up open PRs only: `gh pr view <branch>` also matches merged ones.
          OPEN_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --title "$TITLE" --body "Daily rolling 24h supply-chain embargo bump. Refuses any package version published after \`${NEW_CUTOFF}\`." || true
          elif ! gh pr create --head "$BRANCH" --base main --title "$TITLE" --body "Daily rolling 24h supply-chain embargo bump. Refuses any package version published after \`${NEW_CUTOFF}\`."; then
            # Fail so the run shows red instead of silently leaving the bump unopened.
            echo "::error::Could not create the embargo PR. Allow GitHub Actions to create pull requests, or open one from https://github.com/Mellow-Artificial-Intelligence/openextract/compare/main...chore/embargo-bump?expand=1"
            exit 1
          fi
